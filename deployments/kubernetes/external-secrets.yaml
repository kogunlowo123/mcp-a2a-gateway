# Syncs gateway secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the names
# the startup runbook uses for the audit key and upstream credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-a2a-gateway-database
  namespace: mcp-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: mcp-a2a-gateway-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: mcp-a2a-gateway-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-a2a-gateway-audit-key
  namespace: mcp-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: mcp-a2a-gateway-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^mcp-a2a-gateway-audit-key-"
      rewrite:
        - regexp:
            source: "^mcp-a2a-gateway-audit-key-(.*)$"
            target: "audit-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-a2a-gateway-upstream-credentials
  namespace: mcp-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: mcp-a2a-gateway-upstream-credentials
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^mcp-a2a-gateway-upstream-"
      rewrite:
        - regexp:
            source: "^mcp-a2a-gateway-upstream-(.*)$"
            target: "GATEWAY_UPSTREAM_SECRET_$1"
