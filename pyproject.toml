[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-a2a-gateway"
version = "0.1.0"
description = "Secure MCP and A2A enterprise gateway: governed tool federation with schema pinning, signed agent cards, delegated authority and audited cross-domain calls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "kogunlowo123" }]
dependencies = [
  "agentic-core[otlp] @ git+https://github.com/kogunlowo123/agentic-core@v0.1.0",
  "mcp>=1.20",
  "fastapi>=0.120",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27,<1",
  "cryptography>=43",
  "jsonschema>=4.23",
  "prometheus-client>=0.21",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "agent-identity-fabric @ git+https://github.com/kogunlowo123/agent-identity-fabric@v0.1.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "schemathesis>=4.31",
  "locust>=2.31",
  "mypy>=1.11",
  "ruff>=0.6",
  "black>=24.8",
  "bandit>=1.7.10",
  "types-jsonschema>=4.23",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_a2a_gateway"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "docs", "configs", "policies", "schemas", "deployments",
  "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "pyproject.toml", "uv.lock",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID", "PL", "FAST"]
ignore = ["PLR0913", "PLR2004", "B008"]

[tool.ruff.lint.per-file-ignores]
# Pytest injects fixtures by parameter name, so test signatures are long by design.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "S311", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["mcp_a2a_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=mcp_a2a_gateway --cov-report=term-missing --cov-fail-under=90"
markers = [
  "integration: needs external services (DATABASE_URL)",
  "security: adversarial security test",
  "chaos: fault-injection test",
  "performance: latency or throughput test",
  "e2e: full HTTP lifecycle through the ASGI app",
]

[tool.coverage.run]
branch = true
source = ["mcp_a2a_gateway"]
omit = ["src/mcp_a2a_gateway/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.bandit]
exclude_dirs = ["tests"]
